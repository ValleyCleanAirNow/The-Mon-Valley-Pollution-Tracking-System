name: Mon Valley Pollution Tracking System CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  NODE_VERSION_BACKEND: '22'

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout complete history
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install checksum-verified gitleaks
      env:
        GITLEAKS_VERSION: 8.28.0
        GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
      run: |
        curl --fail --silent --show-error --location \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          --output /tmp/gitleaks.tar.gz
        echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Fail on current-tree findings
      run: gitleaks dir --redact=100 --verbose .

    - name: Fail on full-history findings
      shell: bash
      run: |
        set -o pipefail
        git log -p -U0 --full-history --all | gitleaks stdin --redact=100 --verbose

  # Frontend Tests and Build
  frontend:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    
    - name: Install frontend dependencies
      run: npm ci
    
    - name: Run frontend linting
      run: npm run lint --if-present
    
    - name: Run frontend tests (skip if failing)
      run: npm test -- --watchAll=false --passWithNoTests || echo "Frontend tests failed but continuing..."
      continue-on-error: true
    
    - name: Build frontend
      run: npm run build
    
    - name: Upload frontend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ./frontend/build
        retention-days: 7

  # Backend Tests and Build
  backend:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    defaults:
      run:
        working-directory: ./functions
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ env.NODE_VERSION_BACKEND }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION_BACKEND }}
        cache: 'npm'
        cache-dependency-path: './functions/package-lock.json'
    
    - name: Install backend dependencies
      run: npm ci
    
    - name: Run backend linting
      run: npm run lint --if-present
    
    - name: Run backend tests
      run: npm test
    
    - name: Build backend
      run: npm run build
    
    - name: Upload backend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: ./functions/lib
        retention-days: 7

  # Firestore security rules against the emulator
  rules:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    defaults:
      run:
        working-directory: ./rules-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ env.NODE_VERSION_BACKEND }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION_BACKEND }}
        cache: 'npm'
        cache-dependency-path: './rules-tests/package-lock.json'

    - name: Setup Java (Firestore emulator)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install rules test dependencies
      run: npm ci

    - name: Run Firestore rules tests
      run: npm test

  # Security Audit
  security:
    runs-on: ubuntu-latest
    needs: [frontend, backend, rules]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run frontend security audit
      working-directory: ./frontend
      run: npm audit --audit-level=moderate || echo "Security vulnerabilities found"
      continue-on-error: true
    
    - name: Install backend dependencies
      working-directory: ./functions
      run: npm ci
    
    - name: Run backend security audit
      working-directory: ./functions
      run: npm audit --audit-level=moderate || echo "Security vulnerabilities found"
      continue-on-error: true

  # Deploy to Staging (on develop branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [frontend, backend, security]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: ./frontend/build
    
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-build
        path: ./functions/lib
    
    - name: Setup Firebase CLI
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only hosting,functions --project ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    
    - name: Notify deployment success
      run: echo "Successfully deployed to staging environment"

  # Deploy to Production (on main branch)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [frontend, backend, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: ./frontend/build
    
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-build
        path: ./functions/lib
    
    - name: Setup Firebase CLI
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only hosting,functions --project ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    
    - name: Notify deployment success
      run: echo "Successfully deployed to production environment"

  # Performance and Accessibility Testing
  quality:
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: ./frontend/build
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli@0.12.x
        lhci autorun --upload.target=temporary-public-storage || echo "Lighthouse CI failed"
      working-directory: ./frontend
      continue-on-error: true
